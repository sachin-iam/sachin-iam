name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: sachin-iam
          outputs: |
            light.svg
            dark.svg?palette=github-dark

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add light.svg dark.svg
          git diff --quiet --cached || git commit -m "chore: update snake animation"
          git push
