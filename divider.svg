<svg viewBox="0 0 800 50" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="15%" stop-color="#ff6b35" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#7A18F5" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="50" fill="#0d1117"/>

  <!-- twinkling stars scattered along the strip -->
  <g fill="#ffffff">
    <circle cx="40" cy="15" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="32" r="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="10" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="38" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="18" r="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="370" cy="8" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="40" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="14" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="570" cy="34" r="0.9"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="12" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="705" cy="36" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="16" r="0.9"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- glowing gradient line through the middle -->
  <rect x="0" y="24" width="800" height="2" fill="url(#line)"/>

  <!-- a couple of tiny drifting comets -->
  <circle r="1.6" fill="#c084fc">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 0,25 L 800,25"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
