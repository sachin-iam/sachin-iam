<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7A18F5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="whiteglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ff6b35" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#7A18F5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7A18F5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A18F5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7A18F5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="260" fill="#0d1117"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.2" opacity="0.8"/>
    <circle cx="140" cy="200" r="1" opacity="0.5"/>
    <circle cx="220" cy="60" r="1.4" opacity="0.7"/>
    <circle cx="700" cy="50" r="1.1" opacity="0.6"/>
    <circle cx="740" cy="190" r="1.3" opacity="0.8"/>
    <circle cx="650" cy="220" r="1" opacity="0.5"/>
    <circle cx="90" cy="140" r="1" opacity="0.4"/>
    <circle cx="600" cy="30" r="1" opacity="0.5"/>
  </g>

  <!-- ambient glow: purple by default, flares white during burst -->
  <circle cx="400" cy="130" r="95" fill="url(#glow)" opacity="1">
    <animate attributeName="r" values="85;85;170;170;85;85" keyTimes="0;0.417;0.467;0.533;0.583;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="130" r="95" fill="url(#whiteglow)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.417;0.467;0.533;0.583;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="r" values="85;85;190;190;85;85" keyTimes="0;0.417;0.467;0.533;0.583;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- accretion disk rings, always rotating -->
  <ellipse cx="400" cy="130" rx="150" ry="34" fill="none" stroke="url(#ring1)" stroke-width="7">
    <animateTransform attributeName="transform" type="rotate" from="0 400 130" to="360 400 130" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="400" cy="130" rx="115" ry="24" fill="none" stroke="url(#ring2)" stroke-width="5">
    <animateTransform attributeName="transform" type="rotate" from="360 400 130" to="0 400 130" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- matter continuously spiraling inward, fading as it's "swallowed" -->
  <circle r="2.6" fill="#ffffff">
    <animateMotion dur="4s" repeatCount="indefinite"
      path="M 320,50 Q 250,130 400,130"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#ffd8b0">
    <animateMotion dur="5s" begin="1.5s" repeatCount="indefinite"
      path="M 480,210 Q 470,150 400,130"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" dur="5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.8" fill="#c084fc">
    <animateMotion dur="4.5s" begin="0.7s" repeatCount="indefinite"
      path="M 250,190 Q 320,150 400,130"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" dur="4.5s" begin="0.7s" repeatCount="indefinite"/>
  </circle>

  <!-- matter thrown back out during the white-hole burst -->
  <g>
    <circle r="2.6" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.42;0.47;0.58;0.6;1" dur="12s" repeatCount="indefinite"/>
      <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;0;1;1;1" keyTimes="0;0.42;0.47;0.58;0.6;1" calcMode="linear" path="M 400,130 L 250,40"/>
    </circle>
    <circle r="2.2" fill="#ffd8b0" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.42;0.47;0.58;0.6;1" dur="12s" repeatCount="indefinite"/>
      <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;0;1;1;1" keyTimes="0;0.42;0.47;0.58;0.6;1" calcMode="linear" path="M 400,130 L 570,210"/>
    </circle>
    <circle r="2" fill="#c084fc" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.42;0.47;0.58;0.6;1" dur="12s" repeatCount="indefinite"/>
      <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;0;1;1;1" keyTimes="0;0.42;0.47;0.58;0.6;1" calcMode="linear" path="M 400,130 L 550,60"/>
    </circle>
    <circle r="2.4" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.42;0.47;0.58;0.6;1" dur="12s" repeatCount="indefinite"/>
      <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;0;1;1;1" keyTimes="0;0.42;0.47;0.58;0.6;1" calcMode="linear" path="M 400,130 L 260,210"/>
    </circle>
  </g>

  <!-- event horizon: black hole most of the time, flashes white for the burst -->
  <circle cx="400" cy="130" r="34" opacity="0.65">
    <animate attributeName="fill" values="#0d1117;#0d1117;#ffffff;#ffffff;#0d1117;#0d1117" keyTimes="0;0.417;0.467;0.533;0.583;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="r" values="34;34;72;72;34;34" keyTimes="0;0.417;0.467;0.533;0.583;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="130" r="34" fill="none" stroke="#7A18F5" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="32;37;32" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
